<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 290" fill="none">
  <defs>
    <linearGradient id="ksGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d98b" />
      <stop offset="45%" stop-color="#c89b3c" />
      <stop offset="100%" stop-color="#8f6716" />
    </linearGradient>
    <linearGradient id="ksNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>
    <linearGradient id="ksAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89b3c" />
      <stop offset="50%" stop-color="#f3d98b" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="ksShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#05080f" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Luxury Emblem Graphic -->
  <g transform="translate(65, 14)" filter="url(#ksShadow)">
    <!-- Shield / Diamond Crest Outer Frame -->
    <path d="M 145 8 L 248 42 L 248 138 L 145 186 L 42 138 L 42 42 Z"
          fill="url(#ksNavy)"
          stroke="url(#ksGold)"
          stroke-width="3.5"
          stroke-linejoin="round"/>

    <!-- Inner Accent Inset -->
    <path d="M 145 18 L 236 48 L 236 132 L 145 174 L 54 132 L 54 48 Z"
          fill="none"
          stroke="url(#ksGold)"
          stroke-width="1.2"
          stroke-dasharray="4 3"
          opacity="0.65"/>

    <!-- 'KS' Monogram -->
    <path d="M 86 64 L 86 128 M 122 64 L 86 96 M 98 86 L 124 128" fill="none" stroke="url(#ksAccent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 200 76 Q 190 62 172 64 Q 150 66 150 84 Q 150 100 174 98 Q 200 98 200 114 Q 200 130 174 130 Q 154 130 146 116" fill="none" stroke="url(#ksAccent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Elegant Gold Arc / Orbital Ring -->
    <path d="M 22 108 C 50 162, 238 174, 268 96 C 242 118, 112 128, 35 105 Z"
          fill="url(#ksGold)"
          opacity="0.95"/>

    <!-- Star Accent at Apex -->
    <polygon points="145,24 148,32 156,32 150,37 152,45 145,40 138,45 140,37 134,32 142,32"
             fill="url(#ksAccent)"/>
  </g>

  <!-- Brand Typography: KHAN SHER -->
  <text x="210" y="232"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
        font-size="23"
        font-weight="900"
        fill="#0b0f19"
        letter-spacing="3">
    KHAN SHER
  </text>

  <!-- Subtitle: — LLC — -->
  <g transform="translate(210, 264)">
    <line x1="-70" y1="-5" x2="-25" y2="-5" stroke="#c89b3c" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="0"
          text-anchor="middle"
          font-family="'Plus Jakarta Sans', system-ui, sans-serif"
          font-size="15"
          font-weight="800"
          fill="#c89b3c"
          letter-spacing="5">
      LLC
    </text>
    <line x1="25" y1="-5" x2="70" y2="-5" stroke="#c89b3c" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
